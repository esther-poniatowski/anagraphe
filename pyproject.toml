# Project and package metadata for Anagraphe.

# --- Build System Requirements --------------------------------------------------------------------

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"


# --- Package Metadata -----------------------------------------------------------------------------

[project]
name = "anagraphe"
version = "0.10.0"
authors = [{name = "Esther Poniatowski", email = "esther.poniatowski@ens.psl.eu"}]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
readme = {file = "README.md", content-type = "text/markdown"}
description = "Generates repository indexes from record metadata, and checks their drift and the references between files."
keywords = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha"
]
urls = {homepage = "https://github.com/esther-poniatowski/anagraphe"}


# --- Dependencies ---------------------------------------------------------------------------------

requires-python = ">=3.12"

# The read distribution lies in packages/read-python and carries its own version, which the pin
# below names exactly; a commit of Anagraphe installs both distributions from that commit.
dependencies = [
    "anagraphe-read==0.8.0",
    "hodegos @ git+https://github.com/esther-poniatowski/hodegos.git@a151a28010058fda08a652aea345422037ff0d3c",
    "jsonschema>=4.23",
    "kleisis @ git+https://github.com/esther-poniatowski/kleisis.git@b098f5e4bbabf7a872784fb6974471ad32205269",
    "merismos @ git+https://github.com/esther-poniatowski/merismos.git@74267731c172676ace9cee9ea224d74d118b1f32",
    "PyYAML>=6.0",
    "referencing>=0.35",
    "typer>=0.12",
]

[project.optional-dependencies]
# The tests check the findings logs of the command line with the profile interface of Elenchos,
# pinned by commit. The extra `validate` of Elenchos is left out, since it requires a pinned copy of
# anagraphe-read, which would replace the read distribution of the clone.
test = [
    "elenchos @ git+https://github.com/esther-poniatowski/elenchos.git@33160b25e26226f50283a0503ba9c39796901ea2",
]


# --- Package Source Code --------------------------------------------------------------------------

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
anagraphe = ["py.typed"]

# --- CLI Entry Points -----------------------------------------------------------------------------

[project.scripts]
anagraphe = "anagraphe.cli:app"

# --- Tool Configurations --------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests", "packages/read-python/tests"]
# The tests of the command line reuse the fixtures of the resolution from the read suite.
pythonpath = ["packages/read-python/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
