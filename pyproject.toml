# Project and package metadata for Anagraphe.

# --- Build System Requirements --------------------------------------------------------------------

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"


# --- Package Metadata -----------------------------------------------------------------------------

[project]
name = "anagraphe"
version = "0.10.0"
authors = [{name = "Esther Poniatowski", email = "esther.poniatowski@ens.psl.eu"}]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
readme = {file = "README.md", content-type = "text/markdown"}
description = "Generates repository indexes from record metadata, and checks their drift and the references between files."
keywords = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha"
]
urls = {homepage = "https://github.com/esther-poniatowski/anagraphe"}


# --- Dependencies ---------------------------------------------------------------------------------

requires-python = ">=3.12"

# The read distribution lies in packages/read-python and carries its own version, which the pin
# below names exactly; a commit of Anagraphe installs both distributions from that commit.
dependencies = [
    "anagraphe-read==0.4.0",
    "hodegos @ git+https://github.com/esther-poniatowski/hodegos.git@e61d0d97eaa80cc0cfdd90c3022c1e3916ef1ad9",
    "jsonschema>=4.23",
    "kleisis @ git+https://github.com/esther-poniatowski/kleisis.git@7afe7b6fd4e397264a17bc1d2c45a3ce833f1c40",
    "merismos @ git+https://github.com/esther-poniatowski/merismos.git@74267731c172676ace9cee9ea224d74d118b1f32",
    "PyYAML>=6.0",
    "referencing>=0.35",
    "typer>=0.12",
]


# --- Package Source Code --------------------------------------------------------------------------

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
anagraphe = ["py.typed"]

# --- CLI Entry Points -----------------------------------------------------------------------------

[project.scripts]
anagraphe = "anagraphe.cli:app"

# --- Tool Configurations --------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests", "packages/read-python/tests"]
# The tests of the command line reuse the fixtures of the resolution from the read suite.
pythonpath = ["packages/read-python/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
