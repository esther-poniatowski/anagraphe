name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # The command line requires anagraphe-read by name; the read distribution of the same
          # commit satisfies it.
          pip install -e packages/read-python
          pip install -e .
          pip install black pylint mypy pytest pytest-cov types-PyYAML
      - name: Check formatting (black)
        run: black --check --config config/tools/black.toml src/ tests/ packages/read-python/src/ packages/read-python/tests/
      - name: Run linter (pylint)
        run: pylint --rcfile=config/tools/pylintrc.ini src/ packages/read-python/src/
      - name: Run type checker (mypy)
        run: mypy --config-file config/tools/mypy.ini src/ packages/read-python/src/
      - name: Run tests
        # The test paths of pyproject.toml hold the suites of both distributions.
        run: pytest -v --cov --cov-report=xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
  read-package:
    # The TypeScript read package, which runs the conformance cases of specs/conformance/.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/read/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate the resources from the packaged schemas
        run: npm run generate
      - name: Run type checker (tsc)
        run: npm run typecheck
      - name: Run linter (eslint)
        run: npm run lint
      - name: Check formatting (prettier)
        run: npm run format:check
      - name: Run tests (vitest)
        run: npm test
      - name: Check the tarball
        run: npm pack --dry-run
  docs:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/read-python
          pip install -e .
          pip install sphinx myst-parser sphinx-rtd-theme
      - name: Build documentation
        run: sphinx-build -b html docs/ docs/_build/html
      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs/_build/html/
