# Conformance cases of the record registry of ADR 0007, for the contract anagraphe:record-registry@1.
# Each read side, in Python and in TypeScript, passes the documents; the check cases fix the
# findings of Anagraphe.
#
# A document is the text of a registry. It states the JSON Pointers at which the contract finds a
# defect, each once, in sorted order; a valid document states none. A YAML date, such as
# 2026-11-20, is read as the string that it writes. Beyond the schema, the contract requires that no
# chain of replaced_by returns to an identifier that it has left.
#
# A check case writes its files below an empty repository root, over the shared files, declares the
# sections of anagraphe.yml, among them the section repository that names the repository, then
# states the issues of one check: records, for
# anagraphe records check, or targets, for anagraphe targets check reading the retired identifiers.
# The key remove lists shared files that a case leaves out, and the key sections replaces the
# shared sections. An issue is [file, kind, locus]; the issues of a case are listed in sorted order.
contract: anagraphe:record-registry@1
schema: https://github.com/esther-poniatowski/anagraphe/schemas/record-registry.v1.schema.yml

documents:
- id: written-form-of-the-decision
  text: |
    # Generated by anagraphe records write; do not edit by hand.
    _schema: anagraphe:record-registry@1
    repository: geonexus
    records:
      andre_jean-baptiste: {path: contacts/andre_jean-baptiste.yml, format: yaml}
      mixture-input: {path: notes/mixture-input.md, format: markdown}
    retired:
      former-id: {date: 2026-11-20, replaced_by: mixture-input}
      removed-id: {date: 2026-11-21}
  invalid: []
- id: empty-mappings
  text: "_schema: anagraphe:record-registry@1\nrepository: lab\nrecords: {}\nretired: {}\n"
  invalid: []
- id: quoted-identifier-and-date
  note: An identifier that YAML would read as a number is quoted; a quoted date is the same string.
  text: |
    _schema: anagraphe:record-registry@1
    repository: lab
    records:
      '2024': {path: data/2024.json, format: json}
    retired:
      '1_000': {date: '2026-11-20'}
  invalid: []
- id: missing-keys
  text: "_schema: anagraphe:record-registry@1\nrepository: lab\nrecords: {}\n"
  invalid: ['']
- id: another-version
  text: "_schema: anagraphe:record-registry@2\nrepository: lab\nrecords: {}\nretired: {}\n"
  invalid: [/_schema]
- id: another-root-key
  text: "_schema: anagraphe:record-registry@1\nrepository: lab\nrecords: {}\nretired: {}\ndigest: x\n"
  invalid: ['']
- id: repository-outside-its-pattern
  text: "_schema: anagraphe:record-registry@1\nrepository: Lab_1\nrecords: {}\nretired: {}\n"
  invalid: [/repository]
- id: entry-defects
  note: >-
    A format outside markdown, yaml, json and toml, an entry without path, a key of its own, a path
    leaving the root, and an absolute path.
  text: |
    _schema: anagraphe:record-registry@1
    repository: lab
    records:
      a: {path: a.xml, format: xml}
      b: {format: yaml}
      c: {path: c.yml, format: yaml, digest: x}
      d: {path: ../d.md, format: markdown}
      e: {path: /e.md, format: markdown}
    retired: {}
  invalid: [/records/a/format, /records/b, /records/c, /records/d/path, /records/e/path]
- id: identifier-keys-are-escaped
  note: >-
    A key outside the pattern of record-id is reported at its mapping; a defect inside its entry
    takes the escaped key, ~ as ~0 and / as ~1.
  text: |
    _schema: anagraphe:record-registry@1
    repository: lab
    records:
      a/b: {path: a.md, format: xml}
    retired:
      c~d: {date: 2026-11-20, replaced_by: Ghost}
  invalid: [/records, /records/a~1b/format, /retired, /retired/c~0d/replaced_by]
- id: retirement-defects
  note: A retirement without date, a day absent from the calendar, a time of day, and another key.
  text: |
    _schema: anagraphe:record-registry@1
    repository: lab
    records: {}
    retired:
      a: {replaced_by: b}
      b: {date: 2026-02-30}
      c: {date: 2026-11-20 10:00:00}
      d: {date: 2026-11-20, reason: merged}
  invalid: [/retired/a, /retired/b/date, /retired/c/date, /retired/d]
- id: cycle-of-successors
  note: A chain of renames that returns to an identifier that it has left never ends.
  text: |
    _schema: anagraphe:record-registry@1
    repository: lab
    records: {}
    retired:
      a: {date: 2026-11-20, replaced_by: b}
      b: {date: 2026-11-21, replaced_by: a}
      c: {date: 2026-11-22, replaced_by: a}
      self: {date: 2026-11-22, replaced_by: self}
  invalid: [/retired/a/replaced_by, /retired/b/replaced_by, /retired/c/replaced_by, /retired/self/replaced_by]

sections:
  targets:
    records: {registry: specs/schema-registry.yml}
  records: {}
  repository: {id: lab}
files:
  specs/schema-registry.yml: |
    _schema: kleisis:schema-registry@2
    schemas:
      test:person@1: schemas/person.schema.yml
      test:citing@1: schemas/citing.schema.yml
    exports: []
  schemas/person.schema.yml: |
    x-identifier: identity.id
    properties:
      _schema: {const: test:person@1}
      identity:
        properties:
          id: {type: string}
  schemas/citing.schema.yml: |
    properties:
      _schema: {const: test:citing@1}
      profile:
        $ref: https://github.com/esther-poniatowski/anagraphe/schemas/addressing.v1.schema.yml#/$defs/target
        x-target-contract: ['test:person']
      source:
        $ref: https://github.com/esther-poniatowski/anagraphe/schemas/addressing.v1.schema.yml#/$defs/target
      cites:
        type: array
        items:
          $ref: https://github.com/esther-poniatowski/anagraphe/schemas/addressing.v1.schema.yml#/$defs/target
  people/ada.yml: |
    _schema: test:person@1
    identity: {id: ada}
  notes/n.md: |
    ---
    id: note-n
    ---
    A definition. ^definition
  notes/plain.md: "Text without an identifier.\n"
  record-registry.yml: |
    # Generated by anagraphe records write; do not edit by hand.
    _schema: anagraphe:record-registry@1
    repository: lab
    records:
      ada: {path: people/ada.yml, format: yaml}
      note-n: {path: notes/n.md, format: markdown}
    retired:
      ada-old: {date: 2026-11-01, replaced_by: ada}
      gone: {date: 2026-11-02}
      lost: {date: 2026-11-05, replaced_by: gone}
      note-mid: {date: 2026-11-04, replaced_by: note-n}
      note-old: {date: 2026-11-03, replaced_by: note-mid}

cases:
- id: valid-registry
  note: >-
    The registry equals the generation: every record listed once, a note without identifier left
    out, and every successor a record or a retired identifier.
  check: records
  files: {}
  issues: []
- id: absent-registry
  check: records
  remove: [record-registry.yml]
  files: {}
  issues:
  - [record-registry.yml, stale-registry, '']
- id: unparsed-registry
  note: A registry that cannot be parsed stops every other comparison.
  check: records
  files:
    notes/new.md: "---\nid: new\n---\n"
    record-registry.yml: "records: {ada: [\n"
  issues:
  - [record-registry.yml, invalid-record-registry, '']
- id: registry-violating-its-contract
  note: A schema violation stops every other comparison, here the omitted record new.
  check: records
  files:
    notes/new.md: "---\nid: new\n---\n"
    record-registry.yml: |
      _schema: anagraphe:record-registry@1
      repository: lab
      records:
        ada: {path: people/ada.yml, format: xml}
        note-n: {path: notes/n.md, format: markdown}
      retired: {}
  issues:
  - [record-registry.yml, invalid-record-registry, /records/ada/format]
- id: stale-omitted-record
  check: records
  files:
    notes/new.md: "---\nid: new\n---\n"
  issues:
  - [record-registry.yml, stale-registry, /records/new]
- id: stale-moved-record
  check: records
  remove: [people/ada.yml]
  files:
    people/moved/ada.yml: |
      _schema: test:person@1
      identity: {id: ada}
  issues:
  - [record-registry.yml, stale-registry, /records/ada]
- id: stale-format
  check: records
  files:
    record-registry.yml: |
      # Generated by anagraphe records write; do not edit by hand.
      _schema: anagraphe:record-registry@1
      repository: lab
      records:
        ada: {path: people/ada.yml, format: json}
        note-n: {path: notes/n.md, format: markdown}
      retired: {}
  issues:
  - [record-registry.yml, stale-registry, /records/ada]
- id: stale-retired-entry
  note: An entry naming no record is stale, not vanished, when its identifier is retired.
  check: records
  files:
    record-registry.yml: |
      # Generated by anagraphe records write; do not edit by hand.
      _schema: anagraphe:record-registry@1
      repository: lab
      records:
        ada: {path: people/ada.yml, format: yaml}
        gone: {path: notes/gone.md, format: markdown}
        note-n: {path: notes/n.md, format: markdown}
      retired:
        gone: {date: 2026-11-02}
  issues:
  - [record-registry.yml, stale-registry, /records/gone]
- id: stale-form
  note: Entries equal to the generation, written in another order and without the header.
  check: records
  files:
    record-registry.yml: |
      _schema: anagraphe:record-registry@1
      repository: lab
      records:
        note-n: {path: notes/n.md, format: markdown}
        ada: {path: people/ada.yml, format: yaml}
      retired: {}
  issues:
  - [record-registry.yml, stale-registry, '']
- id: stale-repository
  note: The registry names another repository than the identity, after a rename of the repository.
  check: records
  sections:
    targets:
      records: {registry: specs/schema-registry.yml}
    records: {}
    repository: {id: lab-two, retired: [lab]}
  files: {}
  issues:
  - [record-registry.yml, stale-registry, /repository]
- id: vanished-identifier
  note: >-
    An entry naming no record, and not retired, is vanished only; the successor of note-mid now
    names neither a record nor a retired identifier.
  check: records
  remove: [notes/n.md]
  files: {}
  issues:
  - [record-registry.yml, unknown-successor, /retired/note-mid]
  - [record-registry.yml, vanished-identifier, /records/note-n]
- id: reused-identifier
  note: A record holding a retired identifier is reused only, though records omits it.
  check: records
  files:
    notes/again.md: "---\nid: gone\n---\n"
  issues:
  - [record-registry.yml, reused-identifier, /retired/gone]
- id: unknown-successor
  check: records
  files:
    record-registry.yml: |
      # Generated by anagraphe records write; do not edit by hand.
      _schema: anagraphe:record-registry@1
      repository: lab
      records:
        ada: {path: people/ada.yml, format: yaml}
        note-n: {path: notes/n.md, format: markdown}
      retired:
        former: {date: 2026-11-01, replaced_by: nowhere}
  issues:
  - [record-registry.yml, unknown-successor, /retired/former]
- id: duplicate-identifier-is-not-compared
  note: An identifier held by two records is left to duplicate-identifier of the check of the targets.
  check: records
  files:
    notes/dup.md: "---\nid: ada\n---\n"
  issues: []
- id: unreadable-record-is-not-compared
  note: The entry of a record that cannot be read is kept, since its identifier is unknown.
  check: records
  files:
    people/ada.yml: "identity: {id: ada\n"
  issues: []
- id: renamed-target
  note: >-
    A retired identifier with a successor, followed through two renames, and checked against the
    record of the last one: the unit of a note, and the contract of a typed field.
  check: targets
  files:
    cite.yml: |
      _schema: test:citing@1
      profile: {id: ada-old}
      source: {id: note-old, unit: definition}
      cites:
        - {id: note-mid}
        - {id: note-old, unit: absent}
        - {repository: lab, id: ada-old}
  issues:
  - [cite.yml, renamed-target, /cites/0]
  - [cite.yml, renamed-target, /cites/1]
  - [cite.yml, renamed-target, /cites/2]
  - [cite.yml, renamed-target, /profile]
  - [cite.yml, renamed-target, /source]
  - [cite.yml, unknown-unit, /cites/1]
- id: renamed-target-checks-the-contract-of-its-successor
  check: targets
  files:
    cite.yml: |
      _schema: test:citing@1
      profile: {id: note-old}
  issues:
  - [cite.yml, renamed-target, /profile]
  - [cite.yml, unbound-target, /profile]
- id: retired-target
  note: An identifier retired without a successor, and one whose successor is retired without one.
  check: targets
  files:
    cite.yml: |
      _schema: test:citing@1
      source: {id: gone}
      cites:
        - {id: lost}
        - {id: ghost}
  issues:
  - [cite.yml, retired-target, /cites/0]
  - [cite.yml, retired-target, /source]
  - [cite.yml, unknown-record, /cites/1]
- id: retired-identifiers-without-the-section-records
  note: Without the section records, the check of the targets reads no retired identifier.
  check: targets
  sections:
    targets:
      records: {registry: specs/schema-registry.yml}
  files:
    cite.yml: |
      _schema: test:citing@1
      source: {id: gone}
      profile: {id: ada-old}
  issues:
  - [cite.yml, unknown-record, /profile]
  - [cite.yml, unknown-record, /source]
