# Conformance cases of the record resolver of ADR 0009. Each read side, in Python and in TypeScript,
# passes them; the TypeScript resolver arrives in the task record-reader-views.
#
# The consumer is the root whose targets are resolved. Its files hold the schema registry through
# which the resolver reads the schemas of a contract, under the section records of its targets.
#
# A case declares the resolution context of the consumer: its repository identifier, its former
# identifiers, the commit selected for each repository identifier, the remote of a selected state
# when the case declares one under remotes, the place of the configuration of a selected state when
# the case declares one under configs, as the key config of a declared repository names it, the
# default place of every configuration when the case declares one under fallback, as the key
# resolution.config names it, and the submodules whose state names no repository. The identity of a state is the override repository.id of its configuration, else the name of its
# remote. A commit is an opaque name here. The provider serves the states of
# the case: each state starts from the files of a named shared state, or from no file, then adds the
# files of the case and drops those listed under remove. A file is its text, or {link: path} for a
# symbolic link. A path through a symbolic link to a folder escapes the state. The keys denied and
# invalid list the commits whose access is denied, and those whose bytes fail the verification.
#
# A case resolves its target, then reads the record when the outcome is record, against the entries
# of x-target-contract of the citing field under contracts. It states the outcome among local,
# repository, record and unresolved; the provenance of a resolved target; and the kinds of the
# findings, those of resolve followed by those of read, in their order.
consumer:
  section:
    records: {registry: specs/schema-registry.yml}
  files:
    specs/schema-registry.yml: |
      _schema: kleisis:schema-registry@2
      schemas:
        test:person@1: schemas/person.schema.yml
        test:member@1: schemas/member.schema.yml
        test:argument@1: schemas/argument.schema.yml
      exports: []
    schemas/person.schema.yml: |
      x-identifier: identity.id
      properties:
        _schema: {const: test:person@1}
        identity:
          properties:
            id: {type: string}
    schemas/member.schema.yml: |
      x-identifier: identity.id
      x-implements: test:person@1
      properties:
        _schema: {const: test:member@1}
        identity:
          properties:
            id: {type: string}
    schemas/argument.schema.yml: |
      properties:
        _schema: {const: test:argument@1}
        ideas:
          type: array
          items: {$ref: '#/$defs/idea'}
      $defs:
        idea:
          x-identifier: id
          properties:
            id: {type: string}

states:
  other-lab:
    anagraphe.yml: |
      _schema: anagraphe:configuration@2
      repository: {id: other-lab, retired: [old-lab]}
      targets:
        records: {registry: specs/schema-registry.yml}
      records: {}
    record-registry.yml: |
      # Generated by anagraphe records write; do not edit by hand.
      _schema: anagraphe:record-registry@1
      repository: other-lab
      records:
        ada: {path: people/ada.yml, format: yaml}
        arg.one: {path: args/one.yml, format: yaml}
        bo: {path: people/bo.yml, format: yaml}
        eve: {path: people/eve.yml, format: yaml}
        note-n: {path: notes/n.md, format: markdown}
      retired:
        ada-old: {date: 2026-11-01, replaced_by: ada}
        gone: {date: 2026-11-02}
    people/ada.yml: |
      _schema: test:person@1
      identity: {id: ada}
    people/bo.yml: |
      _schema: test:member@1
      identity: {id: bo}
    people/eve.yml: |
      _schema: test:alien@1
      metadata: {id: eve}
    args/one.yml: |
      _schema: test:argument@1
      metadata: {id: arg.one}
      ideas:
        - {id: claim}
        - {id: premise}
    notes/n.md: |
      ---
      id: note-n
      ---
      # Heading

      A definition. ^definition

cases:
# --- Resolved targets.
- id: record-of-another-repository
  context: {repository: lab, commits: {other-lab: c1}}
  states: {c1: {from: other-lab}}
  target: {repository: other-lab, id: ada}
  contracts: [[test:person]]
  outcome: record
  provenance: {repository: other-lab, commit: c1, path: people/ada.yml}
  findings: []
- id: record-implementing-the-contract
  note: The record follows test:member@1, which declares x-implements test:person@1.
  context: {repository: lab, commits: {other-lab: c1}}
  states: {c1: {from: other-lab}}
  target: {repository: other-lab, id: bo}
  contracts: [[test:person]]
  outcome: record
  provenance: {repository: other-lab, commit: c1, path: people/bo.yml}
  findings: []
- id: repository-itself
  note: A target without id resolves once the identity of the state is verified.
  context: {repository: lab, commits: {other-lab: c1}}
  states: {c1: {from: other-lab, remove: [record-registry.yml]}}
  target: {repository: other-lab}
  outcome: repository
  provenance: {repository: other-lab, commit: c1, path: null}
  findings: []
- id: unit-declared-by-the-contract
  context: {repository: lab, commits: {other-lab: c1}}
  states: {c1: {from: other-lab}}
  target: {repository: other-lab, id: arg.one, unit: claim}
  outcome: record
  provenance: {repository: other-lab, commit: c1, path: args/one.yml}
  findings: []
- id: unit-anchored-in-a-note
  context: {repository: lab, commits: {other-lab: c1}}
  states: {c1: {from: other-lab}}
  target: {repository: other-lab, id: note-n, unit: definition}
  outcome: record
  provenance: {repository: other-lab, commit: c1, path: notes/n.md}
  findings: []
- id: local-target
  note: A target naming the repository of the consumer is resolved by the check of the consumer.
  context: {repository: lab, commits: {other-lab: c1}}
  states: {}
  target: {repository: lab, id: ada}
  outcome: local
  findings: []
- id: renamed-repository-of-the-consumer
  context: {repository: lab, retired: [former-lab], commits: {}}
  states: {}
  target: {repository: former-lab, id: ada}
  outcome: local
  findings: [renamed-repository]
# --- Renames.
- id: renamed-repository
  note: The configuration of the state of other-lab retires old-lab.
  context: {repository: lab, commits: {other-lab: c1}}
  states: {c1: {from: other-lab}}
  target: {repository: old-lab, id: ada}
  outcome: record
  provenance: {repository: other-lab, commit: c1, path: people/ada.yml}
  findings: [renamed-repository]
- id: renamed-target
  context: {repository: lab, commits: {other-lab: c1}}
  states: {c1: {from: other-lab}}
  target: {repository: other-lab, id: ada-old}
  contracts: [[test:person]]
  outcome: record
  provenance: {repository: other-lab, commit: c1, path: people/ada.yml}
  findings: [renamed-target]
- id: retired-target
  context: {repository: lab, commits: {other-lab: c1}}
  states: {c1: {from: other-lab}}
  target: {repository: other-lab, id: gone}
  outcome: unresolved
  findings: [retired-target]
# --- The context and the state.
- id: unknown-repository
  context: {repository: lab, commits: {other-lab: c1}}
  states: {c1: {from: other-lab}}
  target: {repository: ghost-lab, id: ada}
  outcome: unresolved
  findings: [unknown-repository]
- id: unknown-repository-beside-an-unnamed-submodule
  note: A submodule whose state cannot be read may hold the repository, so its state is unread.
  context:
    repository: lab
    commits: {}
    unnamed: [{path: projects/x, commit: c9}]
  states: {}
  target: {repository: ghost-lab, id: ada}
  outcome: unresolved
  findings: [unreadable-target-state]
- id: absent-state
  context: {repository: lab, commits: {other-lab: c1}}
  states: {}
  target: {repository: other-lab, id: ada}
  outcome: unresolved
  findings: [unreadable-target-state]
- id: denied-state
  context: {repository: lab, commits: {other-lab: c1}}
  states: {c1: {from: other-lab}}
  denied: [c1]
  target: {repository: other-lab, id: ada}
  outcome: unresolved
  findings: [unreadable-target-state]
- id: invalid-state
  context: {repository: lab, commits: {other-lab: c1}}
  states: {c1: {from: other-lab}}
  invalid: [c1]
  target: {repository: other-lab, id: ada}
  outcome: unresolved
  findings: [invalid-target-state]
- id: state-without-identity
  note: The configuration declares no override, and the context names no remote of the state.
  context: {repository: lab, commits: {other-lab: c1}}
  states:
    c1:
      from: other-lab
      files:
        anagraphe.yml: "_schema: anagraphe:configuration@2\nrecords: {}\n"
  target: {repository: other-lab, id: ada}
  outcome: unresolved
  findings: [invalid-target-repository]
- id: identity-from-the-remote-of-the-state
  note: Without an override, the name of the remote of the state names it.
  context: {repository: lab, commits: {other-lab: c1}, remotes: {other-lab: 'https://example.org/lab/other-lab.git'}}
  states:
    c1:
      from: other-lab
      files:
        anagraphe.yml: "_schema: anagraphe:configuration@2\nrecords: {}\n"
  target: {repository: other-lab, id: ada}
  contracts: [[test:person]]
  outcome: record
  provenance: {repository: other-lab, commit: c1, path: people/ada.yml}
  findings: []
- id: override-declaring-another-identifier
  note: The override prevails over a remote naming the entry.
  context: {repository: lab, commits: {other-lab: c1}, remotes: {other-lab: 'https://example.org/lab/other-lab.git'}}
  states:
    c1:
      from: other-lab
      files:
        anagraphe.yml: "_schema: anagraphe:configuration@2\nrepository: {id: third-lab}\nrecords: {}\n"
  target: {repository: other-lab}
  outcome: unresolved
  findings: [invalid-target-repository]
- id: remote-naming-another-identifier
  context: {repository: lab, commits: {other-lab: c1}, remotes: {other-lab: 'https://example.org/lab/third-lab.git'}}
  states:
    c1:
      from: other-lab
      files:
        anagraphe.yml: "_schema: anagraphe:configuration@2\nrecords: {}\n"
  target: {repository: other-lab}
  outcome: unresolved
  findings: [invalid-target-repository]
- id: invalid-section-repository-of-the-state
  context: {repository: lab, commits: {other-lab: c1}}
  states:
    c1:
      from: other-lab
      files:
        anagraphe.yml: "_schema: anagraphe:configuration@2\nrepository: {id: Other_Lab}\nrecords: {}\n"
  target: {repository: other-lab}
  outcome: unresolved
  findings: [invalid-target-repository]
- id: two-configuration-files
  context: {repository: lab, commits: {other-lab: c1}}
  states:
    c1:
      from: other-lab
      files:
        .config/anagraphe.yml: "_schema: anagraphe:configuration@2\nrecords: {}\n"
  target: {repository: other-lab, id: ada}
  outcome: unresolved
  findings: [invalid-target-repository]
- id: configuration-in-config
  note: The subfolder config/ of the state is a place of its configuration.
  context: {repository: lab, commits: {other-lab: c1}}
  states:
    c1:
      from: other-lab
      remove: [anagraphe.yml]
      files:
        config/anagraphe.yml: "_schema: anagraphe:configuration@2\nrepository: {id: other-lab}\nrecords: {}\n"
  target: {repository: other-lab, id: ada}
  contracts: [[test:person]]
  outcome: record
  provenance: {repository: other-lab, commit: c1, path: people/ada.yml}
  findings: []
- id: configuration-in-a-folder-outside-the-places
  note: >-
    A folder that no rule of Hodegos admits, such as shared/, holds no configuration, so the remote
    of the state names it, and its targets stay unverified.
  context: {repository: lab, commits: {other-lab: c1}, remotes: {other-lab: 'https://example.org/lab/other-lab.git'}}
  states:
    c1:
      from: other-lab
      remove: [anagraphe.yml]
      files:
        shared/anagraphe.yml: "_schema: anagraphe:configuration@2\nrepository: {id: other-lab}\nrecords: {}\n"
  target: {repository: other-lab, id: ada}
  outcome: unresolved
  findings: [unverified-target]
- id: configuration-in-config-and-at-the-root
  note: The root and config/ of the state both hold a configuration, which competes.
  context: {repository: lab, commits: {other-lab: c1}}
  states:
    c1:
      from: other-lab
      files:
        config/anagraphe.yml: "_schema: anagraphe:configuration@2\nrecords: {}\n"
  target: {repository: other-lab, id: ada}
  outcome: unresolved
  findings: [invalid-target-repository]
- id: configuration-at-the-place-named-by-the-entry
  note: >-
    The key config of the entry names settings/anagraphe.yml, a place that no rule of Hodegos
    admits, so the configuration and the registry of the state are read there.
  context: {repository: lab, commits: {other-lab: c1}, configs: {other-lab: settings/anagraphe.yml}}
  states:
    c1:
      from: other-lab
      remove: [anagraphe.yml]
      files:
        settings/anagraphe.yml: "_schema: anagraphe:configuration@3\nrepository: {id: other-lab}\nrecords: {}\n"
  target: {repository: other-lab, id: ada}
  contracts: [[test:person]]
  outcome: record
  provenance: {repository: other-lab, commit: c1, path: people/ada.yml}
  findings: []
- id: configuration-outside-the-places-without-the-key
  note: >-
    The state of the previous case, without the key config: the accepted places are searched and
    hold no configuration, so the remote of the state names it, and its targets stay unverified.
  context: {repository: lab, commits: {other-lab: c1}, remotes: {other-lab: 'https://example.org/lab/other-lab.git'}}
  states:
    c1:
      from: other-lab
      remove: [anagraphe.yml]
      files:
        settings/anagraphe.yml: "_schema: anagraphe:configuration@3\nrepository: {id: other-lab}\nrecords: {}\n"
  target: {repository: other-lab, id: ada}
  outcome: unresolved
  findings: [unverified-target]
- id: place-named-by-the-entry-beside-an-accepted-place
  note: >-
    The place named by the key config is read alone, so a configuration at the root of the state
    neither competes with it nor replaces it.
  context: {repository: lab, commits: {other-lab: c1}, configs: {other-lab: settings/anagraphe.yml}}
  states:
    c1:
      from: other-lab
      files:
        settings/anagraphe.yml: "_schema: anagraphe:configuration@3\nrepository: {id: third-lab}\nrecords: {}\n"
  target: {repository: other-lab, id: ada}
  outcome: unresolved
  findings: [invalid-target-repository]
- id: place-named-by-the-entry-absent
  note: >-
    The key config names a file that the state does not hold, so the entry is invalid, even though
    the root of the state holds a configuration.
  context: {repository: lab, commits: {other-lab: c1}, configs: {other-lab: settings/anagraphe.yml}}
  states: {c1: {from: other-lab}}
  target: {repository: other-lab, id: ada}
  outcome: unresolved
  findings: [invalid-target-repository]
- id: configuration-at-the-default-place
  note: >-
    No accepted place of the state holds a configuration, so the default place that the root names
    under resolution.config is read.
  context: {repository: lab, commits: {other-lab: c1}, fallback: settings/anagraphe.yml}
  states:
    c1:
      from: other-lab
      remove: [anagraphe.yml]
      files:
        settings/anagraphe.yml: "_schema: anagraphe:configuration@3\nrepository: {id: other-lab}\nrecords: {}\n"
  target: {repository: other-lab, id: ada}
  contracts: [[test:person]]
  outcome: record
  provenance: {repository: other-lab, commit: c1, path: people/ada.yml}
  findings: []
- id: place-named-by-the-entry-before-the-default
  note: The key config of the entry replaces the default place for that entry.
  context:
    repository: lab
    commits: {other-lab: c1}
    configs: {other-lab: named/anagraphe.yml}
    fallback: settings/anagraphe.yml
  states:
    c1:
      from: other-lab
      remove: [anagraphe.yml]
      files:
        named/anagraphe.yml: "_schema: anagraphe:configuration@3\nrepository: {id: other-lab}\nrecords: {}\n"
        settings/anagraphe.yml: "_schema: anagraphe:configuration@3\nrepository: {id: third-lab}\nrecords: {}\n"
  target: {repository: other-lab, id: ada}
  contracts: [[test:person]]
  outcome: record
  provenance: {repository: other-lab, commit: c1, path: people/ada.yml}
  findings: []
- id: accepted-place-before-the-default
  note: The root of the state holds a configuration, so the default place is not read.
  context: {repository: lab, commits: {other-lab: c1}, fallback: settings/anagraphe.yml}
  states:
    c1:
      from: other-lab
      files:
        settings/anagraphe.yml: "_schema: anagraphe:configuration@3\nrepository: {id: third-lab}\nrecords: {}\n"
  target: {repository: other-lab, id: ada}
  contracts: [[test:person]]
  outcome: record
  provenance: {repository: other-lab, commit: c1, path: people/ada.yml}
  findings: []
- id: default-place-absent
  note: >-
    The default place holds no file, so the state is read without configuration: the remote of the
    state names it, and its targets stay unverified.
  context:
    repository: lab
    commits: {other-lab: c1}
    remotes: {other-lab: 'https://example.org/lab/other-lab.git'}
    fallback: settings/anagraphe.yml
  states: {c1: {from: other-lab, remove: [anagraphe.yml]}}
  target: {repository: other-lab, id: ada}
  outcome: unresolved
  findings: [unverified-target]
- id: default-place-absent-without-identity
  note: >-
    The default place holds no file, and the state has no remote, so the state has no identity.
  context: {repository: lab, commits: {other-lab: c1}, fallback: settings/anagraphe.yml}
  states: {c1: {from: other-lab, remove: [anagraphe.yml]}}
  target: {repository: other-lab, id: ada}
  outcome: unresolved
  findings: [invalid-target-repository]
# --- The registry of the state.
- id: state-without-configuration
  note: >-
    ADR 0007 admits a repository without registry, so its targets stay unverified; the remote of
    the state names it.
  context: {repository: lab, commits: {other-lab: c1}, remotes: {other-lab: 'https://example.org/lab/other-lab.git'}}
  states: {c1: {from: other-lab, remove: [anagraphe.yml]}}
  target: {repository: other-lab, id: ada}
  outcome: unresolved
  findings: [unverified-target]
- id: configuration-without-records
  context: {repository: lab, commits: {other-lab: c1}}
  states:
    c1:
      from: other-lab
      files:
        anagraphe.yml: "_schema: anagraphe:configuration@2\nrepository: {id: other-lab}\ntargets: {}\n"
  target: {repository: other-lab, id: ada}
  outcome: unresolved
  findings: [unverified-target]
- id: declared-registry-absent
  context: {repository: lab, commits: {other-lab: c1}}
  states: {c1: {from: other-lab, remove: [record-registry.yml]}}
  target: {repository: other-lab, id: ada}
  outcome: unresolved
  findings: [unverified-target]
- id: registry-at-a-declared-path
  context: {repository: lab, commits: {other-lab: c1}}
  states:
    c1:
      from: other-lab
      remove: [record-registry.yml]
      files:
        anagraphe.yml: "_schema: anagraphe:configuration@2\nrepository: {id: other-lab}\nrecords: {path: meta/records.yml}\n"
        meta/records.yml: |
          _schema: anagraphe:record-registry@1
          repository: other-lab
          records:
            ada: {path: people/ada.yml, format: yaml}
          retired: {}
  target: {repository: other-lab, id: ada}
  outcome: record
  provenance: {repository: other-lab, commit: c1, path: people/ada.yml}
  findings: []
- id: invalid-registry
  context: {repository: lab, commits: {other-lab: c1}}
  states:
    c1:
      from: other-lab
      files:
        record-registry.yml: "_schema: anagraphe:record-registry@1\nrepository: other-lab\nrecords: {}\n"
  target: {repository: other-lab, id: ada}
  outcome: unresolved
  findings: [invalid-record-registry]
- id: registry-of-another-repository
  context: {repository: lab, commits: {other-lab: c1}}
  states:
    c1:
      from: other-lab
      files:
        record-registry.yml: "_schema: anagraphe:record-registry@1\nrepository: third-lab\nrecords: {}\nretired: {}\n"
  target: {repository: other-lab, id: ada}
  outcome: unresolved
  findings: [invalid-record-registry]
- id: unknown-record
  context: {repository: lab, commits: {other-lab: c1}}
  states: {c1: {from: other-lab}}
  target: {repository: other-lab, id: ghost}
  outcome: unresolved
  findings: [unknown-record]
# --- The registered path.
- id: linked-target-path
  context: {repository: lab, commits: {other-lab: c1}}
  states: {c1: {from: other-lab, files: {people/ada.yml: {link: ../elsewhere/ada.yml}}}}
  target: {repository: other-lab, id: ada}
  outcome: record
  provenance: {repository: other-lab, commit: c1, path: people/ada.yml}
  findings: [linked-target-path]
- id: escaping-target-path
  note: The folder people is a symbolic link, so the registered path may leave the state.
  context: {repository: lab, commits: {other-lab: c1}}
  states:
    c1:
      from: other-lab
      remove: [people/ada.yml, people/bo.yml, people/eve.yml]
      files: {people: {link: ../../elsewhere}}
  target: {repository: other-lab, id: ada}
  outcome: record
  provenance: {repository: other-lab, commit: c1, path: people/ada.yml}
  findings: [escaping-target-path]
- id: registered-path-naming-no-file
  context: {repository: lab, commits: {other-lab: c1}}
  states: {c1: {from: other-lab, remove: [people/ada.yml]}}
  target: {repository: other-lab, id: ada}
  outcome: record
  provenance: {repository: other-lab, commit: c1, path: people/ada.yml}
  findings: [stale-target-registry]
- id: registered-path-naming-another-record
  context: {repository: lab, commits: {other-lab: c1}}
  states: {c1: {from: other-lab, files: {people/ada.yml: "_schema: test:person@1\nidentity: {id: bo}\n"}}}
  target: {repository: other-lab, id: ada}
  outcome: record
  provenance: {repository: other-lab, commit: c1, path: people/ada.yml}
  findings: [stale-target-registry]
- id: unreadable-record
  context: {repository: lab, commits: {other-lab: c1}}
  states: {c1: {from: other-lab, files: {people/ada.yml: "identity: [unclosed\n"}}}
  target: {repository: other-lab, id: ada}
  outcome: record
  provenance: {repository: other-lab, commit: c1, path: people/ada.yml}
  findings: [unreadable-record]
- id: record-of-another-format
  note: The registry places a YAML record and registers it as Markdown.
  context: {repository: lab, commits: {other-lab: c1}}
  states:
    c1:
      from: other-lab
      files:
        record-registry.yml: |
          _schema: anagraphe:record-registry@1
          repository: other-lab
          records:
            ada: {path: people/ada.yml, format: markdown}
          retired: {}
  target: {repository: other-lab, id: ada}
  outcome: record
  provenance: {repository: other-lab, commit: c1, path: people/ada.yml}
  findings: [unreadable-record]
- id: record-identified-through-the-metadata-of-the-state
  note: >-
    The default identifier of a record is read through the metadata source that the configuration
    of its state declares; a JSON document has no built-in source.
