name: anagraphe
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  # Data manipulation and formats
  - pyyaml                 # YAML file handling
  - types-pyyaml           # type stubs for PyYAML
  - jsonschema             # index-type schema validation
  - referencing            # local JSON Schema registry
  - pathspec               # exclusions in .gitignore syntax
  # Development tools
  - black                  # code formatting
  - mypy                   # static type checking
  - mypy_extensions
  - pylint                 # code linting
  - pyright                # static type analysis
  - python-semantic-release # release versioning from conventional commits
  # Testing
  - pytest
  - pytest-mock
  - pytest-cov
  - pytest-pylint          # Pylint plugin for Pytest
  # Documentation
  - sphinx                 # documentation generator
  - myst-parser            # Markdown support for Sphinx
  - sphinx-rtd-theme       # ReadTheDocs theme
  - sphinx-needs           # for requirements and specifications in Sphinx
  - esbonio                # language server for Sphinx
  # CLI
  - typer                  # command line interface
  - rich                   # terminal output formatting
  # Sibling tools, pinned by commit as pyproject.toml pins them; pip installs a Git reference,
  # which a conda dependency cannot name.
  - pip
  - pip:
      - merismos @ git+https://github.com/esther-poniatowski/merismos.git@85e62c1cd15f24aa2def25c119d5aae040e993c0
variables:
