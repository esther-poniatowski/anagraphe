name: anagraphe
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  # Data manipulation and formats
  - pyyaml                 # YAML file handling
  - types-pyyaml           # type stubs for PyYAML
  - jsonschema             # index-type schema validation
  - referencing            # local JSON Schema registry
  - pathspec               # exclusions in .gitignore syntax
  # Development tools
  - black                  # code formatting
  - mypy                   # static type checking
  - mypy_extensions
  - pylint                 # code linting
  - pyright                # static type analysis
  - python-semantic-release # release versioning from conventional commits
  # Testing
  - pytest
  - pytest-mock
  - pytest-cov
  - pytest-pylint          # Pylint plugin for Pytest
  # Documentation
  - sphinx                 # documentation generator
  - myst-parser            # Markdown support for Sphinx
  - sphinx-rtd-theme       # ReadTheDocs theme
  - sphinx-needs           # for requirements and specifications in Sphinx
  - esbonio                # language server for Sphinx
  # CLI
  - typer                  # command line interface
  - rich                   # terminal output formatting
  # Sibling tools, pinned by commit as pyproject.toml pins them; pip installs a Git reference,
  # which a conda dependency cannot name.
  - pip
  - pip:
      - merismos @ git+https://github.com/esther-poniatowski/merismos.git@74267731c172676ace9cee9ea224d74d118b1f32
      - kleisis @ git+https://github.com/esther-poniatowski/kleisis.git@b098f5e4bbabf7a872784fb6974471ad32205269
      - hodegos @ git+https://github.com/esther-poniatowski/hodegos.git@a151a28010058fda08a652aea345422037ff0d3c
      # The profile interface of Elenchos, which the tests of the findings logs use, without its
      # extra validate, which would replace the read distribution of this clone.
      - elenchos @ git+https://github.com/esther-poniatowski/elenchos.git@33160b25e26226f50283a0503ba9c39796901ea2
      # The read distribution of this clone, which the command line requires by name; pip reads the
      # path from the folder of this file.
      - -e packages/read-python
variables:
