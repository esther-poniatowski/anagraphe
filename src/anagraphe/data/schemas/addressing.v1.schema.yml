$schema: https://json-schema.org/draft/2020-12/schema
$id: https://github.com/esther-poniatowski/anagraphe/schemas/addressing.v1.schema.yml
title: Addressing primitives
description: >-
  The identifiers of a repository, of a record and of a unit, and the logical target that names a
  record, a unit inside it, or a repository, as ADR 0006 of Anagraphe states them. A change that
  makes a valid target invalid, or changes the meaning of a key, publishes a new major version
  under a new $id.
$defs:
  repository-id:
    title: Repository identifier
    description: The identifier of a repository, overridden under repository.id of its anagraphe.yml, else derived from the name of its remote origin or of its folder.
    type: string
    pattern: '^[a-z0-9]+(-[a-z0-9]+)*$(?!\n)'
  record-id:
    title: Record identifier
    description: The identifier of a record, unique within its repository.
    type: string
    pattern: '^[a-z0-9]+([._-][a-z0-9]+)*$(?!\n)'
  unit-id:
    title: Unit identifier
    description: >-
      The identifier of a unit declared inside a record: the identifier of an item whose
      definition carries x-identifier in a YAML record, or the name of a block anchor, without its
      caret, in a Markdown record.
    type: string
    pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$(?!\n)'
  contract-entry:
    title: Contract entry
    description: >-
      An entry of x-target-contract, naming a contract as namespace:name, which admits every version
      of that contract, or as namespace:name@n, which admits version n only.
    type: string
    pattern: '^[a-z][a-z0-9-]*:[a-z][a-z0-9.-]*(@[1-9][0-9]*)?$(?!\n)'
  property-path:
    title: Property path
    description: >-
      The value of x-identifier: a dotted path of property names, followed from the node that
      carries the keyword to the field holding an identifier.
    type: string
    pattern: '^[A-Za-z_][A-Za-z0-9_-]*(\.[A-Za-z_][A-Za-z0-9_-]*)*$(?!\n)'
  field-path:
    title: Field path
    description: >-
      The text naming one node of a document, from its root, as the field-path specification of
      Anagraphe states it. A key follows a dot, except at the start, a position in a sequence
      stands between brackets, counted from zero, and a key that a bare key cannot hold stands
      between brackets as a JSON string. The empty text names the root.
    type: string
    pattern: '^(?:(?:[^.\[\]"''*\u0000-\u0020\u007f-\u00a0\u1680\u2000-\u200a\u2028\u2029\u202f\u205f\u3000]+|\[(?:0|[1-9][0-9]{0,14}|"(?:[^"\\\u0000-\u001f]|\\["\\/bfnrt]|\\u[0-9A-Fa-f]{4})*")\])(?:\.[^.\[\]"''*\u0000-\u0020\u007f-\u00a0\u1680\u2000-\u200a\u2028\u2029\u202f\u205f\u3000]+|\[(?:0|[1-9][0-9]{0,14}|"(?:[^"\\\u0000-\u001f]|\\["\\/bfnrt]|\\u[0-9A-Fa-f]{4})*")\])*)?$(?!\n)'
  field-path-pattern:
    title: Field-path pattern
    description: >-
      A field path that may also hold the wildcards [*], naming every item of a sequence, and *,
      naming every key of a mapping, so that one pattern names several nodes.
    type: string
    pattern: '^(?:(?:(?:[^.\[\]"''*\u0000-\u0020\u007f-\u00a0\u1680\u2000-\u200a\u2028\u2029\u202f\u205f\u3000]+|\*)|\[(?:\*|0|[1-9][0-9]{0,14}|"(?:[^"\\\u0000-\u001f]|\\["\\/bfnrt]|\\u[0-9A-Fa-f]{4})*")\])(?:\.(?:[^.\[\]"''*\u0000-\u0020\u007f-\u00a0\u1680\u2000-\u200a\u2028\u2029\u202f\u205f\u3000]+|\*)|\[(?:\*|0|[1-9][0-9]{0,14}|"(?:[^"\\\u0000-\u001f]|\\["\\/bfnrt]|\\u[0-9A-Fa-f]{4})*")\])*)?$(?!\n)'
  target:
    title: Logical target
    description: >-
      A record of a repository, a unit inside that record, or a repository itself. An absent
      repository names the repository holding the citing file, and an absent unit names the whole
      record. A target with a repository and without an id names that repository, and holds no
      unit.
    type: object
    additionalProperties: false
    properties:
      repository:
        $ref: '#/$defs/repository-id'
      id:
        $ref: '#/$defs/record-id'
      unit:
        $ref: '#/$defs/unit-id'
    anyOf:
      - required: [id]
      - required: [repository]
    dependentRequired:
      unit: [id]
