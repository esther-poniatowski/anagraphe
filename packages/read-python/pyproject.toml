# Project and package metadata for anagraphe-read, the Python read side of Anagraphe.

# --- Build System Requirements --------------------------------------------------------------------

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"


# --- Package Metadata -----------------------------------------------------------------------------

[project]
name = "anagraphe-read"
# The version of the interface of anagraphe_read, raised by hand when the interface or the
# behaviour changes; the release of the command line does not stamp it.
version = "0.3.0"
authors = [{name = "Esther Poniatowski", email = "esther.poniatowski@ens.psl.eu"}]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
readme = {file = "README.md", content-type = "text/markdown"}
description = "Reads the logical targets, repository identities, record registries and bindings of Anagraphe."
keywords = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha"
]
urls = {homepage = "https://github.com/esther-poniatowski/anagraphe"}


# --- Dependencies ---------------------------------------------------------------------------------

requires-python = ">=3.12"

# The pins equal those of the root pyproject.toml of Anagraphe.
dependencies = [
    "jsonschema>=4.23",
    "kleisis @ git+https://github.com/esther-poniatowski/kleisis.git@7afe7b6fd4e397264a17bc1d2c45a3ce833f1c40",
    "merismos @ git+https://github.com/esther-poniatowski/merismos.git@74267731c172676ace9cee9ea224d74d118b1f32",
    "pathspec>=0.12",
    "PyYAML>=6.0",
    "referencing>=0.35",
]


# --- Package Source Code --------------------------------------------------------------------------

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
anagraphe_read = ["py.typed", "data/schemas/*.yml"]

# --- Tool Configurations --------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
